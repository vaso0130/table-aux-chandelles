<style>
  /* ── 擲筊（自牌桌館移植） ── */
  #qiu { text-align: center; }
  #jiao { display: flex; gap: 20px; justify-content: center; align-items: flex-end; height: 52px; margin: 10px 0 4px; }
  .jiao-block { width: 66px; height: 34px; position: relative; }
  .jiao-block.flat {
    background: linear-gradient(#b8542f, #93381f);
    border-radius: 10px 10px 30px 30px / 8px 8px 26px 26px;
    box-shadow: inset 0 3px 0 rgba(255,226,180,.4), 0 3px 8px rgba(0,0,0,.4);
  }
  .jiao-block.round {
    background: linear-gradient(#7c2d1c 20%, #a5462f);
    border-radius: 32px 32px 10px 10px / 30px 30px 8px 8px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4);
  }
  .jiao-block::after {
    content: attr(data-face); position: absolute; inset: 0;
    display: grid; place-items: center;
    color: #f6e7c8; font-size: 13px; letter-spacing: .15em;
  }
  @keyframes jiao-toss {
    0% { transform: translateY(0) rotate(0); }
    45% { transform: translateY(-40px) rotate(200deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }
  .jiao-block.toss { animation: jiao-toss .55s ease-in; }
  #qiu-stick {
    width: 30px; height: 132px; margin: 12px auto 2px;
    background: linear-gradient(90deg, #caa25e, #e5c98c 45%, #b98f4e);
    border: 1px solid #8a6a33; border-radius: 4px 4px 8px 8px;
    writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center;
    color: #7a2418; font-size: 15px; letter-spacing: .1em; font-weight: 700;
    box-shadow: 0 4px 10px rgba(0,0,0,.45);
  }
  @keyframes stick-out { 0% { transform: translateY(26px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  #qiu-stick.out { animation: stick-out .5s ease-out; }
  #qiu-stick[hidden] { display: none; }
  #qiu-log { font-size: 12.5px; color: var(--muted); letter-spacing: .06em; min-height: 1.5em; margin: 6px 0 0; }
  #qiu-caption { color: var(--ivory-shade); font-size: 14.5px; min-height: 1.6em; }
  #slip-scroll { overflow-x: auto; text-align: center; margin-top: 18px; }

  /* ── 詩籤（古式直排籤紙） ── */
  .qslip {
    --qred: #9b2b1f; --qink: #3d2e19;
    display: inline-block; width: max-content; max-width: none; margin: 0 auto; padding: 10px;
    background: linear-gradient(165deg, #f7eed6, #efe0ba 55%, #e7d3a4);
    border: 1px solid #c9a45c; border-radius: 2px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5), inset 0 0 70px rgba(150,95,30,.14);
    color: var(--qink); position: relative; text-align: initial;
  }
  .qslip-inner {
    border: 3px double var(--qred); padding: 20px 16px 20px 20px; position: relative;
    width: max-content;
    background:
      radial-gradient(ellipse at 18% 8%, rgba(155,43,31,.05), transparent 42%),
      radial-gradient(ellipse at 85% 92%, rgba(155,43,31,.05), transparent 42%);
  }
  .qslip-body { writing-mode: vertical-rl; height: 430px; line-height: 1.9; }
  .qslip-body > div { margin-left: 10px; }
  .qs-no { color: var(--qred); font-size: 21px; font-weight: 700; letter-spacing: .3em; margin-left: 14px; }
  .qs-grade {
    color: #f3e5c2; background: var(--qred); border-radius: 2px;
    padding: 10px 3px; font-size: 15px; letter-spacing: .35em; align-self: flex-start;
    height: calc(2.7em + 20px); /* 等第皆兩字；直排下 max-content 在 Chromium 只量到一字，會截字 */ box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .qs-gz { font-size: 11px; color: #8a5a28; letter-spacing: .12em; margin-left: 12px; }
  .qs-gua { font-size: 12px; color: #7a3d20; letter-spacing: .1em; border-left: 1px solid rgba(155,43,31,.35); padding-left: 8px; margin-left: 14px; }
  .qs-bai { font-size: 12px; color: #6a5230; letter-spacing: .03em; }
  .qs-titlebar { font-size: 16px; letter-spacing: .3em; border-left: 1px solid rgba(155,43,31,.4); padding-left: 8px; margin-left: 14px; }
  .qs-poem { font-size: 19px; letter-spacing: .22em; font-weight: 600; }
  .qs-poem:last-of-type { margin-left: 16px; }
  .qs-jie { font-size: 13.5px; color: #6a4a22; border-left: 1px solid rgba(155,43,31,.4); padding-left: 8px; margin-left: 14px; max-height: 430px; }
  .qs-item { font-size: 12.5px; color: #5b4526; letter-spacing: .05em; }
  .qs-item b { color: var(--qred); font-weight: 700; }
  .qs-story { font-size: 11.5px; color: #77602f; border-left: 1px solid rgba(155,43,31,.35); padding-left: 8px; margin-left: 12px; }
  .qs-house { font-size: 10.5px; color: #9a814c; letter-spacing: .3em; margin-left: 4px; }
  .qs-seal {
    position: absolute; left: 14px; bottom: 14px; width: 40px; height: 40px;
    background: var(--qred); color: #f3e5c2; border-radius: 3px;
    writing-mode: vertical-rl; display: grid; place-items: center;
    font-size: 15px; letter-spacing: .2em; opacity: .88;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); z-index: 2;
  }
  @media (max-width: 640px) {
    .qslip-body { height: 400px; }
    .qs-poem { font-size: 17px; }
  }

  /* ── 燭光一句 ── */
  .yiju-card {
    max-width: 560px; margin: 22px auto 0; padding: 44px 34px 38px;
    border: 3px double var(--gold-dim); border-radius: 3px;
    background: linear-gradient(170deg, rgba(201,164,92,.07), transparent 55%), var(--felt-800);
    text-align: center; position: relative;
  }
  .yiju-card::before {
    content: "❦"; position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    background: var(--felt-900); padding: 0 12px; color: var(--gold-dim); font-size: 14px;
  }
  .yiju-no { color: var(--gold-dim); font-size: 12px; letter-spacing: .4em; text-indent: .4em; margin-bottom: 18px; }
  .yiju-text {
    color: var(--gold-bright); font-size: clamp(21px, 4.5vw, 27px);
    line-height: 1.9; letter-spacing: .08em; text-wrap: balance;
  }
  .yiju-tail { color: var(--muted); font-size: 12px; margin-top: 22px; letter-spacing: .2em; }
</style>

<script>
const $ = id => document.getElementById(id);
const BL = DC.bookLink;

/* 籤庫外置於 qs-data.js */

/* ═══ 系統 ═══ */
const SYS = [
  { id: "yiju", name: "燭光一句", sub: "百句原創・一翻即答", btn: "翻 開",
    hint: "默想問題，翻開這本只有一句話的書——一百句裡，機緣替你挑一句。" },
  { id: "kieu", name: "翹傳開卷", sub: "Bói Kiều・越南", btn: "焚 香 開 卷",
    hint: "拜過徐海王、覺緣師太、翠翹仙，翻開《金雲翹傳》——指到哪句，命運答哪句。" },
  { id: "qs", name: "靈籤求籤", sub: "百首靈籤・擲筊", btn: "上 香 稟 告",
    hint: "上香默稟、請筊、搖籤——連三聖筊定籤；陰筊三至，今日不取。此樓無神，司籤者機緣。" }
];
let sysId = "yiju";

function renderSys() {
  $("sys").innerHTML = "";
  SYS.forEach(s => {
    const b = document.createElement("button");
    b.className = "sys-btn" + (s.id === sysId ? " active" : "");
    b.innerHTML = '<span class="d-name">' + s.name + '</span><span class="d-sub">' + s.sub + '</span>';
    b.onclick = () => { sysId = s.id; renderSys(); updateForm(); if (book) book.show(sysId); };
    $("sys").appendChild(b);
  });
}
function updateForm() {
  const s = SYS.find(x => x.id === sysId);
  $("p-title").textContent = s.name;
  $("p-hint").textContent = s.hint;
  $("btn-go").textContent = s.btn;
  $("btn-go").hidden = false;
  $("btn-reset").hidden = true;
  $("out").innerHTML = ""; $("slip-scroll").innerHTML = "";
  $("prompt-sec").hidden = true;
  $("qiu").hidden = sysId !== "qs";
  if (sysId === "qs") qiuInit();
}


/* ═══ 燭光一句 ═══ */
function runYiju() {
  const q = $("q-input").value.trim();
  const i = DC.rand(DC.YIJU.length);
  const s = DC.YIJU[i];
  $("out").innerHTML = '<div class="yiju-card"><div class="yiju-no">' + BL("yiju", "原創百句", "燭光一句") + "・" + BL("yiju", "第" + (i + 1) + "句", "第 " + (i + 1) + " 句") + '</div>' +
    '<div class="yiju-text">' + s + '</div>' +
    '<div class="yiju-tail">' + BL("yiju", "此樓無神", "此樓無神・司卷者機緣") + '</div></div>';
  const pr = ["「燭光一句」開卷（本站原創答案之書,crypto 真隨機，百句取一）。" + DC.toneHead(), ""];
  if (q) pr.push("我的問題:" + q, "");
  pr.push("翻得第 " + (i + 1) + " 句：「" + s + "」", "");
  pr.push("請把這一句當作神諭展開:1. 這句話對我的問題最直接的讀法。2. 它可能在提醒我忽略了什麼。3. 依這句話，接下來一週我該做的一件具體小事。請簡短，一句神諭不需要長篇大論。");
  $("prompt-box").value = pr.join("\n");
  $("prompt-sec").hidden = false;
  DC.histSave("開卷館", "燭光一句・第" + (i + 1) + "句", q, $("out").innerHTML, $("prompt-box").value);
}

/* ═══ 翹傳開卷（自南洋館遷入） ═══ */
function kieuDetail(i) {
  const [viet, hant, title, gloss, pol] = DC.KIEU[i];
  const polTxt = pol === "good" ? "吉" : pol === "bad" ? "慎" : "平";
  return '<div class="result-card"><h3>第 ' + (i + 1) + " 句・" + title +
    '<span class="badge' + (pol === "bad" ? " red" : pol === "good" ? "" : " dim") + '" style="margin-left:10px">' + polTxt + "</span></h3>" +
    '<p class="lead" style="font-style:italic;line-height:2">' + viet.replace(/\n/g, "<br>") + "</p>" +
    '<p style="color:var(--ivory)">' + hant + "</p><p>" + gloss + "</p></div>";
}
function runKieu() {
  const q = $("q-input").value.trim();
  if (!q) { $("go-hint").textContent = "開卷前，先寫下你的問題"; return; }
  $("go-hint").textContent = "";
  const i = DC.rand(DC.KIEU.length);
  const [viet, hant, title, gloss, pol] = DC.KIEU[i];
  const polTxt = pol === "good" ? "吉" : pol === "bad" ? "慎" : "平";
  $("out").innerHTML = DC.card(BL("kieu", "焚香拜請"), BL("kieu", "Bói Kiều"),
    '<p style="color:var(--muted);font-style:italic">「Lạy vua Từ Hải, lạy vãi Giác Duyên, lạy tiên Thúy Kiều…」<br>拜徐海王、拜覺緣師太、拜翠翹仙——默唸問題，書頁自開。</p>') +
    DC.card(BL("kieu", "第" + (i + 1) + "句", "第 " + (i + 1) + " 句・" + title), '<span class="badge' + (pol === "bad" ? " red" : pol === "good" ? "" : " dim") + '">' + BL("kieu", polTxt) + "</span>",
    '<p class="lead" style="font-style:italic;line-height:2">' + viet.replace(/\n/g, "<br>") + "</p>" +
    '<p style="color:var(--ivory)">' + hant + "</p><p>" + gloss + "</p>");
  const pr = ["越南翹傳開卷(Bói Kiều,《金雲翹傳》選句卅五之第 " + (i + 1) + " 句,crypto 真隨機開卷)。" + DC.toneHead(), ""];
  pr.push("我的問題:" + q, "");
  pr.push("詩句:" + viet.replace(/\n/g, " / "));
  pr.push("中譯:" + hant);
  pr.push("題:" + title + "(" + polTxt + ");籤面初解:" + gloss, "");
  pr.push("請以越南 Bói Kiều 傳統解讀:1. 這句在《翹傳》原文中的情節脈絡（誰、在何處、何種處境）——以情節喻我之處境。2. 逐字逐意細解詩句意象如何對應我的問題。3. 給出明確傾向（吉/平/慎）與行動建議。4. 若懂喃字傳統可補充該句的音韻與雙關之美。");
  $("prompt-box").value = pr.join("\n");
  $("prompt-sec").hidden = false;
  DC.histSave("開卷館", "翹傳開卷・" + title, q, $("out").innerHTML, $("prompt-box").value);
}

/* ═══ 靈籤求籤（自牌桌館移植，擲筊儀式原樣） ═══ */
let qiuStep = "bing", qiuStick = 0, qiuLog = [], qiuBusy = false;
let qiuSheng = 0, qiuYin = 0;

function qiuInit() {
  qiuStep = "bing"; qiuStick = 0; qiuLog = []; qiuBusy = false;
  qiuSheng = 0; qiuYin = 0;
  $("qiu-caption").textContent = "燭已點好。心中默想所問之事——此樓無神，司籤者機緣；誠心即可上香。";
  $("qiu-log").textContent = "";
  $("jiao").hidden = true;
  $("qiu-stick").hidden = true;
  $("btn-go").hidden = false;
  $("btn-go").textContent = "上 香 稟 告";
  $("btn-reset").hidden = true;
}
/* 求籤經過卡（顯示用：筊名、籤號可點進字典；提示詞仍用純文字 qiuLog） */
function qiuTrace(head) {
  const lk = (t) => t.replace(/聖筊|笑筊|陰筊/g, (m) => BL("qs", m))
    .replace(/^第(\d+)籤/, (m, n) => BL("qs", "第" + cnNum(+n) + "籤", m))
    .replace(/退籤$/, (m) => BL("qs", "退籤", m));
  return DC.card(head, "", "<ol>" + qiuLog.map((t) => "<li>" + lk(t) + "</li>").join("") + "</ol>");
}
function qiuRest() {
  qiuStep = "rest"; qiuStick = 0;
  $("qiu-stick").hidden = true;
  $("btn-go").hidden = true;
  $("btn-reset").hidden = false;
  $("qiu-caption").textContent = "三陰筊至——機緣不到，尚不是時候取籤。靜下心，把所問之事想得更清楚，改日再來請筊。";
  $("out").innerHTML = qiuTrace(BL("qs", "陰筊三至", "陰筊三至・今日不取"));
}
function tossJiao(cb) {
  qiuBusy = true;
  $("jiao").hidden = false;
  [$("jiao-a"), $("jiao-b")].forEach((el) => {
    el.className = "jiao-block round";
    el.dataset.face = "";
    el.classList.remove("toss"); void el.offsetWidth; el.classList.add("toss");
  });
  const a = DC.rand01() < 0.5, b = DC.rand01() < 0.5;
  setTimeout(() => {
    [[$("jiao-a"), a], [$("jiao-b"), b]].forEach(([el, flat]) => {
      el.className = "jiao-block " + (flat ? "flat" : "round");
      el.dataset.face = flat ? "平" : "凸";
    });
    qiuBusy = false;
    cb(a !== b ? "sheng" : a ? "xiao" : "yin");
  }, 580);
}
function buildSlip(c, linked) {
  const el = document.createElement("div");
  el.className = "qslip";
  const g = KJ_YI[c.gua - 1];
  const L = linked ? (k, t) => BL("qs", k, t) : (k, t) => (t == null ? k : t);
  el.innerHTML = `
    <div class="qslip-inner">
      <div class="qs-seal">機緣</div>
      <div class="qslip-body">
        <div class="qs-no">第${cnNum(c.n)}籤</div>
        <div class="qs-gz">${L("干支籤", c.gz + "籤")}・${L(c.wx, "屬" + c.wx)}　利${c.wxs}　宜其${c.wxd}</div>
        <div class="qs-grade">${L(c.grade)}</div>
        <div class="qs-titlebar">${c.zh}</div>
        ${c.poem.map((l) => `<div class="qs-poem">${l}</div>`).join("")}
        <div class="qs-gua">${L("卦象")}　${L(g[0])}（${g[1].split("・").slice(0, 2).join("・")}）</div>
        <div class="qs-jie">${L("解曰")}　${c.jie}</div>
        <div class="qs-bai">${L("白話")}　${c.bai}</div>
        ${c.items.map(([k, v]) => `<div class="qs-item"><b>${L("分項", k)}</b>　${v}</div>`).join("")}
        <div class="qs-story">${L("典故")}　${c.story}</div>
        <div class="qs-house">燭 光 卷 樓 ・ 機 緣 司 籤</div>
      </div>
    </div>`;
  return el;
}
function qsPrompt(c) {
  const g = KJ_YI[c.gua - 1];
  const q0 = $("q-input").value.trim();
  return [
    "你是一位深諳廟宇籤詩的解籤人，擅長從籤詩、等第、詩意、典故，以及干支五行與卦象推衍問事者的處境。請以繁體中文為我解籤。" + DC.toneHead(),
    "",
    `【靈籤】第${cnNum(c.n)}籤・${c.grade}——「${c.zh}」`,
    `干支:${c.gz}籤，屬${c.wx}——利${c.wxs},宜其${c.wxd}(可據此參酌時令與方位)。`,
    `卦象：第${c.gua}卦「${g[0]}」(${g[1]})——${g[2]}`,
    "籤詩:",
    ...c.poem.map((l) => `　${l}`),
    `解曰:${c.jie}`,
    `白話:${c.bai}`,
    "分項:" + c.items.map(([k, v]) => `${k}——${v}`).join(";"),
    `典故:${c.story}`,
    ...(qiuLog.length ? [`求籤經過:${qiuLog.join(";")}。(本樓無神，筊以機緣為斷)`] : []),
    "",
    "【請提供】",
    "1. 籤詩逐句釋義與整體詩意（白話可為底本，請再深入）",
    "2. 等第與典故如何映照我的處境",
    "3. 以卦象與干支五行輔斷：卦義與籤詩相參，時令方位可供擇時參考",
    "4. 就我所問之事的具體推斷（可參考分項）",
    "5. 給問事者的具體建議",
    "",
    q0 ? `我所問之事:${q0}` : "我所問之事:〔請把你想問的事寫在這裡〕",
  ].join("\n");
}
function confirmQian() {
  const c = QS_CARDS[qiuStick - 1];
  $("slip-scroll").innerHTML = "";
  $("slip-scroll").appendChild(buildSlip(c, true));
  $("out").innerHTML = qiuTrace("求籤經過・" + BL("qs", "第" + cnNum(c.n) + "籤", "第" + cnNum(c.n) + "籤") + "・" + BL("qs", c.grade));
  $("slip-scroll").scrollLeft = $("slip-scroll").scrollWidth;
  $("qiu-caption").textContent = `第${cnNum(c.n)}籤・${c.grade}——「${c.zh}」。籤紙已展於案上。`;
  $("btn-go").hidden = true;
  $("btn-reset").hidden = false;
  $("prompt-box").value = qsPrompt(c);
  $("prompt-sec").hidden = false;
  DC.histSave("開卷館", `靈籤・第${cnNum(c.n)}籤「${c.zh}」`, $("q-input").value.trim(),
    '<div style="overflow-x:auto;text-align:center">' + $("slip-scroll").innerHTML + "</div>" + $("out").innerHTML, $("prompt-box").value);
}
function qiuClick() {
  if (qiuBusy) return;
  if (qiuStep === "bing") {
    $("qiu-caption").textContent = "已默稟。擲筊請示——今日可否賜籤？";
    $("btn-go").textContent = "擲 筊 請 籤";
    qiuStep = "qing";
    return;
  }
  if (qiuStep === "qing") {
    tossJiao((r) => {
      if (r === "sheng") {
        qiuLog.push("請籤筊：聖筊——允");
        $("qiu-caption").textContent = "聖筊——機緣已允。搖動籤筒，求你的籤。";
        $("btn-go").textContent = "搖 籤 筒";
        qiuStep = "yao";
      } else if (r === "xiao") {
        qiuLog.push("請籤筊：笑筊");
        $("qiu-caption").textContent = "笑筊——未聞其詳。把所問之事在心中說得更清楚，再擲。";
      } else {
        qiuLog.push("請籤筊：陰筊");
        qiuYin++;
        if (qiuYin >= 3) { $("qiu-log").textContent = qiuLog.join("　"); qiuRest(); return; }
        $("qiu-caption").textContent = `陰筊——機緣未至。靜心三息，再擲一次。(陰筊已 ${qiuYin} 次，三至則今日不取)`;
      }
      $("qiu-log").textContent = qiuLog.join("　");
    });
    return;
  }
  if (qiuStep === "yao") {
    qiuStick = 1 + DC.rand(QS_CARDS.length);
    qiuSheng = 0;
    $("qiu-stick").textContent = `第${cnNum(qiuStick)}籤`;
    $("qiu-stick").hidden = false;
    $("qiu-stick").classList.remove("out"); void $("qiu-stick").offsetWidth; $("qiu-stick").classList.add("out");
    $("qiu-caption").textContent = `籤筒傾落一支——第${cnNum(qiuStick)}籤。連得三聖筊，方為此籤。`;
    $("btn-go").textContent = "擲 筊 問 籤";
    qiuStep = "que";
    return;
  }
  if (qiuStep === "que") {
    tossJiao((r) => {
      if (r === "sheng") {
        qiuSheng++;
        qiuLog.push(`第${qiuStick}籤・聖筊 ${qiuSheng}/3`);
        $("qiu-log").textContent = qiuLog.join("　");
        if (qiuSheng >= 3) {
          $("qiu-stick").hidden = true;
          $("jiao").hidden = true;
          confirmQian();
        } else {
          $("qiu-caption").textContent = `聖筊${cnNum(qiuSheng)}——再擲。連得三聖筊，方為此籤。`;
        }
      } else if (r === "xiao") {
        qiuLog.push(`第${qiuStick}籤・笑筊——退籤`);
        $("qiu-caption").textContent = `笑筊——莞爾未答。第${cnNum(qiuStick)}籤退回筒中，重新搖籤。`;
        $("qiu-log").textContent = qiuLog.join("　");
        qiuStick = 0; qiuSheng = 0;
        $("qiu-stick").hidden = true;
        $("btn-go").textContent = "搖 籤 筒";
        qiuStep = "yao";
      } else {
        qiuLog.push(`第${qiuStick}籤・陰筊——退籤`);
        qiuYin++;
        $("qiu-log").textContent = qiuLog.join("　");
        if (qiuYin >= 3) { qiuRest(); return; }
        $("qiu-caption").textContent = `陰筊——非此籤。第${cnNum(qiuStick)}籤退回筒中，重新搖籤。(陰筊已 ${qiuYin} 次，三至則今日不取)`;
        qiuStick = 0; qiuSheng = 0;
        $("qiu-stick").hidden = true;
        $("btn-go").textContent = "搖 籤 筒";
        qiuStep = "yao";
      }
    });
  }
}

/* ═══ 主流程 ═══ */
$("btn-go").onclick = () => {
  if (sysId === "yiju") runYiju();
  else if (sysId === "kieu") runKieu();
  else qiuClick();
};
$("btn-reset").onclick = () => {
  $("slip-scroll").innerHTML = ""; $("out").innerHTML = "";
  $("prompt-sec").hidden = true;
  qiuInit();
};
$("btn-copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("prompt-box").value); }
  catch (e) { $("prompt-box").select(); document.execCommand("copy"); }
  $("copy-ok").hidden = false; setTimeout(() => $("copy-ok").hidden = true, 2500);
};
renderSys(); updateForm();
DC.toneInit(() => { if (!$("prompt-sec").hidden) $("prompt-box").value = $("prompt-box").value.replace(/語氣：「[^」]*」/, "語氣：「" + DC.toneValue() + "」"); });
DC.histBind("開卷館");

/* ═══ 入門教學：符號字典＋盤面讀法（內容在 kaijuan-learn.js；三術與起卦頁同步） ═══ */
let book = null;
DC.learnInit(() => '<div id="learn-book"></div>', (learn) => {
  book = DC.learnBook(learn.querySelector("#learn-book"), kaijuanBook(), (id) => { sysId = id; renderSys(); updateForm(); });
  book.show(sysId);
  /* ?peek=yiju-N / kieu-N / qs-N：直接打開該句／該籤 */
  const m = location.search.match(/peek=(yiju|kieu|qs)-(\d+)/);
  if (m) {
    const n = +m[2], key = m[1] === "qs" ? "第" + cnNum(n) + "籤" : "第" + n + "句";
    if (sysId !== m[1]) { sysId = m[1]; renderSys(); updateForm(); }
    book.open(m[1], key);
  }
});
if (/[?&]peek=(yiju|kieu|qs)-\d+/.test(location.search) && !/[?&]learn=1/.test(location.search)) document.querySelector('.view-btn[data-view="learn"]').click();

/* 開發測試:?test=yiju|kieu|qs(qs 直接定籤) */
(function () {
  const t = new URLSearchParams(location.search).get("test");
  if (!t || !SYS.some(s => s.id === t)) return;
  sysId = t; renderSys(); updateForm();
  $("q-input").value = "測試提問：這件事會順利嗎？";
  setTimeout(() => {
    try {
      if (t === "qs") {
        qiuStick = 1 + DC.rand(QS_CARDS.length);
        qiuLog = ["請籤筊：聖筊——允", `第${qiuStick}籤・聖筊 1/3`, `第${qiuStick}籤・聖筊 2/3`, `第${qiuStick}籤・聖筊 3/3`];
        confirmQian();
      } else $("btn-go").onclick();
      document.title = $("prompt-sec").hidden ? "KJ-TEST-FAIL(hidden)" : "KJ-TEST-OK";
    } catch (e) { document.title = "KJ-TEST-FAIL " + e.message; }
  }, 60);
})();
</script>
